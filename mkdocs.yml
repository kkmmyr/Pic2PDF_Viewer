# Pic2PDF_Viewer 設計ドキュメントの HTML ビルド設定
#
# - ソース: docs/ 配下の Markdown
# - 出力先: frontend/public/site/（.gitignore）
#     Vite の publicDir 配下に出力することで、dev (:5176/site/) からも
#     リリース統合ビルド (:8090/site/) からも閲覧可能になる。
# - ビルド: mkdocs build  →  frontend/public/site/index.html 以下が生成される
# - プレビュー: mkdocs serve  →  http://localhost:8000
# - リリース統合: FastAPI が frontend/public/site/ を /docs-html にもマウントする
#
# 詳細は CLAUDE.md「設計ドキュメントの HTML 配信」セクション。

site_name: Pic2PDF_Viewer 設計ドキュメント
site_description: WebP/ZIP → PDF ビューア（OCR + 小説 RAG 機能含む）の設計ドキュメント

docs_dir: docs
site_dir: frontend/public/site

# ローカルファイルとして直接開く前提。ナビゲーション内のリンクが file:// でも動くよう、
# use_directory_urls=false でフラットに *.html を吐く（site/01_要件定義/foo.html 形式）。
use_directory_urls: false

theme:
  name: material
  language: ja
  features:
    - navigation.tabs       # 上部に大区分タブ
    - navigation.sections   # 左サイドバーをグルーピング
    - navigation.indexes    # 各セクション直下の index.md を見出しに
    - navigation.top        # トップへ戻るボタン
    - search.suggest        # 検索サジェスト
    - content.code.copy     # コードブロックにコピーボタン
    - content.tabs.link     # タブ式ブロックのリンク同期
  palette:
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替

markdown_extensions:
  # 表 / 注釈 / 折りたたみ等の基本拡張
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  # pymdown-extensions（mkdocs-material と一緒に入る）
  - pymdownx.details      # <details> 折りたたみ
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      # Mermaid を ```mermaid フェンスで描画できるよう設定
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - ja
        - en
  # Mermaid 描画（CDN から mermaid.js を読み込む）
  - mermaid2

# サイト内検索が日本語でも効くよう、CJK tokenizer を有効化
extra:
  generator: false  # フッタの "Made with Material for MkDocs" を非表示

# ナビゲーション（手書き）。
# docs/index.md の構成と一致させ、サイドバーに章立てを明示する。
# 新規ファイル追加時は本ファイルと docs/index.md の両方に追記する。
nav:
  - ホーム: index.md
  - 01. 要件定義:
      - 要件定義書: 01_要件定義/要件定義書.md
      - 小説テキスト検索・RAG機能: 01_要件定義/小説テキスト検索・RAG機能.md
      - バックログ: 01_要件定義/バックログ.md
  - 02. 基本設計:
      - 基本設計書: 02_基本設計/基本設計書.md
      - ADR 一覧: 02_基本設計/ADR/README.md
  - 03. 詳細設計:
      - 共通: 03_詳細設計/詳細設計書_共通.md
      - バックエンド編: 03_詳細設計/詳細設計書_バックエンド編.md
      - フロントエンド編: 03_詳細設計/詳細設計書_フロントエンド編.md
      - API 仕様書: 03_詳細設計/API仕様書.md
      - OCR 設計書: 03_詳細設計/OCR設計書.md
      - hitomi 新着監視: 03_詳細設計/hitomi新着監視設計書.md
      - 小説 RAG バックエンド設計: 03_詳細設計/小説テキスト検索・RAG機能_バックエンド設計.md
      - 小説 RAG フロントエンド設計: 03_詳細設計/小説テキスト検索・RAG機能_フロントエンド設計.md
      - セキュリティ設計書: 03_詳細設計/セキュリティ設計書.md
      - ライセンス・コンプライアンス: 03_詳細設計/ライセンス・コンプライアンス.md
  - 04. 環境構築:
      - GPU 環境セットアップ: 04_環境構築/GPU環境セットアップ.md
      - uv 環境セットアップ: 04_環境構築/uv環境セットアップ.md
      - RemoteControl Discord 通知設定: 04_環境構築/RemoteControl_Discord通知設定.md
      - 運用ガイド: 04_環境構築/運用ガイド.md
  - 05. 記録:
      - 変更履歴: 05_記録/変更履歴.md
      - 既知の問題: 05_記録/既知の問題.md
      - 小説 RAG 技術知見: 05_記録/小説RAG_技術知見.md
  - 06. リファクタリング:
      - 計画書: 06_リファクタリング/リファクタリング計画書.md
      - 履歴: 06_リファクタリング/リファクタリング履歴.md
      - テスト整備計画書（BE）: 06_リファクタリング/テスト整備計画書.md
      - テスト整備計画書（FE）: 06_リファクタリング/テスト整備計画書_フロントエンド編.md
  - 99. アーカイブ:
      - 実装ログ_2026-04-14: 99_アーカイブ/実装ログ_2026-04-14.md
      - LLM 層リファクタリング_完了記録: 99_アーカイブ/LLM層リファクタリング_完了記録.md
