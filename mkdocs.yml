# Pic2PDF_Viewer 設計ドキュメントの HTML ビルド設定
#
# - ソース: docs/ 配下の Markdown
# - 出力先: frontend/public/site/（.gitignore）
#     Vite の publicDir 配下に出力することで、dev (:5176/site/) からも
#     リリース統合ビルド (:8090/site/) からも閲覧可能になる。
# - ビルド: mkdocs build  →  frontend/public/site/index.html 以下が生成される
# - プレビュー: mkdocs serve  →  http://localhost:8000
# - リリース統合: FastAPI が frontend/public/site/ を /docs-html にもマウントする
#
# 詳細は docs/design/環境構築/設計書運用ルール.md のHTMLビルド手順。

site_name: Pic2PDF_Viewer 設計ドキュメント
site_description: WebP/ZIP → PDF ビューア（OCR + 小説 RAG 機能含む）の設計ドキュメント

docs_dir: docs
site_dir: frontend/public/site

# ローカルファイルとして直接開く前提。ナビゲーション内のリンクが file:// でも動くよう、
# use_directory_urls=false でフラットに *.html を吐く（site/design/要件定義/foo.html 形式）。
use_directory_urls: false

# --strict 時の検証レベル調整。
# 設計書は意図的に backend/frontend のソースコードへ相対リンクする（docs_dir 外）。
# mkdocs は docs_dir 外へのリンクも「本当に存在しないリンク」も同じ links.not_found
# カテゴリで警告し、両者を区別する手段が無い（メッセージ文言も同一）。
# .md→.md のリンク切れは scripts/maintenance/check_docs.py（pre-commit でブロック）が
# 独立かつ正確に検知しているため、mkdocs 側の links.not_found は info に格下げする。
# nav の同期（omitted_files / not_found）は check_docs.py Rule 3 と独立した二重チェックとして
# デフォルト（warn＝strict で失敗）のまま維持する。
# anchorsは凍結済み記録の旧見出しも報告するためinfoにする。
# living文書の見出し参照は文書再編時に生成HTMLと別途照合する。
validation:
  links:
    not_found: info
    anchors: info
    unrecognized_links: info

theme:
  name: material
  language: ja
  features:
    - navigation.tabs       # 上部に大区分タブ
    - navigation.sections   # 左サイドバーをグルーピング
    - navigation.indexes    # 各セクション直下の index.md を見出しに
    - navigation.top        # トップへ戻るボタン
    - search.suggest        # 検索サジェスト
    - content.code.copy     # コードブロックにコピーボタン
    - content.tabs.link     # タブ式ブロックのリンク同期
  palette:
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替

markdown_extensions:
  # 表 / 注釈 / 折りたたみ等の基本拡張
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  # pymdown-extensions（mkdocs-material と一緒に入る）
  - pymdownx.details      # <details> 折りたたみ
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      # Mermaid を ```mermaid フェンスで描画できるよう設定
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - ja
        - en
  # Mermaid 描画（CDN から mermaid.js を読み込む）
  - mermaid2

# サイト内検索が日本語でも効くよう、CJK tokenizer を有効化
extra:
  generator: false  # フッタの "Made with Material for MkDocs" を非表示

# 物理配置はdesign/log/archive、navは読み手の目的で分類する。
# living文書を追加したらnavへ、横断契約を追加したらindexの正本マップにも登録する。
# 凍結記録とADRはそれぞれの索引から全件へ到達できるようにする。
nav:
  - ホーム: index.md
  - 設計:
      - 全体像・要件:
          - 要件定義: design/要件定義/要件定義書.md
          - 基本設計: design/基本設計/基本設計書.md
      - 共通・各層の設計:
          - データ配置・配信構成: design/詳細設計/詳細設計書_共通.md
          - バックエンド: design/詳細設計/詳細設計書_バックエンド編.md
          - バックエンド ファイルマップ: design/詳細設計/詳細設計書_バックエンド_ファイルマップ.md
          - フロントエンド: design/詳細設計/詳細設計書_フロントエンド編.md
          - フロントエンド ファイルマップ: design/詳細設計/詳細設計書_フロントエンド_ファイルマップ.md
          - API設計: design/詳細設計/API.md
          - セキュリティ: design/詳細設計/セキュリティ設計書.md
      - 機能別設計:
          - 閲覧・取り込み:
              - ライブラリ・リーダー: design/詳細設計/機能別/ライブラリ・リーダーUI設計.md
              - hitomi新着監視: design/詳細設計/機能別/hitomi新着監視設計書.md
          - Kindle:
              - 自動撮影の利用要件: design/要件定義/Kindle自動撮影取込_要件.md
              - 購入カタログ・画面: design/詳細設計/機能別/Kindle購入カタログ設計.md
              - 自動撮影ジョブ契約: design/詳細設計/機能別/Kindle自動撮影ジョブ契約.md
              - 価格監視: design/詳細設計/機能別/Kindle価格監視設計.md
          - OCR:
              - 実行・QA・公開: design/詳細設計/機能別/OCR設計書.md
              - Mac補助確認の比較契約: design/詳細設計/機能別/Mac_OCR補助確認設計.md
          - 小説RAG:
              - データ: design/詳細設計/機能別/小説RAG_データ.md
              - 構築パイプライン: design/詳細設計/機能別/小説RAG_パイプライン設計.md
              - 検索・QA: design/詳細設計/機能別/小説RAG_検索QA設計.md
              - フロントエンド: design/詳細設計/機能別/小説RAG_フロントエンド設計.md
              - Sol隔離生成・評価: design/詳細設計/機能別/小説RAG_Sol生成・評価設計.md
          - 端末・外部連携:
              - Codex端末間連携: design/詳細設計/機能別/Codex端末間連携設計.md
              - 画像生成カタログとの境界: design/詳細設計/機能別/画像生成カタログ設計.md
      - 設計判断（ADR）:
          - ADR一覧: design/基本設計/ADR/README.md
  - 開発・運用:
      - 開発環境:
          - uv workspace: design/環境構築/uv環境セットアップ.md
          - Mac開発環境: design/環境構築/Mac開発環境セットアップ.md
          - GPU環境: design/環境構築/GPU環境セットアップ.md
      - 配備・日常運用:
          - 運用・バックアップ・障害対応: design/環境構築/運用ガイド.md
          - Linux・Sambaセットアップ: design/環境構築/Linux_Sambaセットアップ.md
          - Windowsサービス化: design/環境構築/Windowsサービス化セットアップ.md
          - サーバー操作コマンド: design/環境構築/サーバー連携よく利用するコマンド.md
          - RemoteControl Discord通知: design/環境構築/RemoteControl_Discord通知設定.md
          - 既知の問題: log/既知の問題.md
      - 開発ルール:
          - 設計書の更新・ビルド: design/環境構築/設計書運用ルール.md
          - 品質ガードレール: design/詳細設計/品質ガードレール.md
          - 保守資産・互換層: design/環境構築/保守資産・互換層台帳.md
          - Codexサブエージェント運用: design/環境構築/Codexサブエージェント運用.md
          - ライセンス・コンプライアンス: design/環境構築/ライセンス・コンプライアンス.md
  - 計画:
      - バックログ・優先順位: log/計画/バックログ.md
      - OCR品質改善・Mac比較: log/計画/小説OCR品質改善_実装計画.md
      - Sol生成・評価の導入: log/計画/Sol生成・評価_導入計画.md
      - 内部改善・技術メンテナンス: log/計画/リファクタリング計画書.md
  - 記録・履歴:
      - 変更履歴: log/変更履歴.md
      - 技術知見:
          - Kindle実機: log/技術知見/Kindle自動撮影_実機知見.md
          - OCR品質: log/技術知見/OCR品質改善_技術知見.md
          - 小説RAG・モデル比較: log/技術知見/小説RAG_技術知見.md
          - テスト: log/技術知見/テスト知見.md
      - 評価資料:
          - 茉莉花官吏伝 シリーズ横断分析: log/技術知見/茉莉花官吏伝_シリーズ横断分析.md
      - 過去の記録:
          - アーカイブ索引: archive/index.md
