server {
    listen 8090;
    server_name _;

    # ---------------------------------------------------------------------------
    # 静的ファイル: nginx が直接ディスクから配信（uvicorn を経由しない）
    # expires 30d + immutable でブラウザキャッシュを 30 日間有効化
    # ---------------------------------------------------------------------------

    location /thumbnails/ {
        alias /opt/pic2pdf-viewer/data/doujin/thumbnails/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /opt/pic2pdf-viewer/data/doujin/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /comic/thumbnails/ {
        alias /opt/pic2pdf-viewer/data/comic/thumbnails/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /comic/images/ {
        alias /opt/pic2pdf-viewer/data/comic/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /comic/pdfs/ {
        alias /opt/pic2pdf-viewer/data/comic/pdfs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /kindle_novel/thumbnails/ {
        alias /opt/pic2pdf-viewer/data/kindle_novel/thumbnails/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /kindle_novel/images/ {
        alias /opt/pic2pdf-viewer/data/kindle_novel/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # フロントエンド JS/CSS アセット（ビルドハッシュ付きなので長期キャッシュ可）
    location /assets/ {
        alias /opt/pic2pdf-viewer/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 設計ドキュメント（存在する場合のみ利用）
    location /docs-html/ {
        alias /opt/pic2pdf-viewer/frontend/public/site/;
        try_files $uri $uri/ $uri/index.html =404;
        expires 1h;
    }

    # ---------------------------------------------------------------------------
    # API: uvicorn（localhost:8091）へプロキシ
    # ---------------------------------------------------------------------------

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 500m;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------------------------------
    # SPA フロントエンド: dist/index.html を返す（React Router 対応）
    # ---------------------------------------------------------------------------

    location / {
        root /opt/pic2pdf-viewer/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
