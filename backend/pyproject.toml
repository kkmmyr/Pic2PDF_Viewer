[project]
name = "pic2pdf-viewer-backend"
version = "0.1.0"
description = "Pic2PDF Viewer backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "img2pdf",
    "natsort",
    "Pillow",
    "pymupdf",
    "python-dotenv",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

# ----------------------------------------------------------------------------
# Ruff (linter)
# 実行: cd backend && uv run ruff check .
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# F: Pyflakes (未使用 import / 未定義変数 等)
# E/W: pycodestyle のエラー・警告
# I: isort (import 順序)
# B: flake8-bugbear (mutable default など意図せぬバグ)
# UP: pyupgrade (古い構文の自動更新)
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 行長は line-length で別管理（formatter 任せにしたいので警告は抑止）
    "B008",  # FastAPI の Depends(...) を引数デフォルトに置くため
]

[tool.ruff.lint.per-file-ignores]
# テストではダミー変数や長い fixture 名が出るので一部緩める
"tests/**" = ["B011"]
