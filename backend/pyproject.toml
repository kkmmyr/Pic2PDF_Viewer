[project]
name = "pic2pdf-viewer-backend"
version = "0.1.0"
description = "Pic2PDF Viewer backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn",
    "img2pdf",
    "natsort",
    "Pillow",
    "pymupdf",
    "python-dotenv",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "python-multipart>=0.0.28",
    "lancedb>=0.34,<0.35",
    "alembic>=1.18.4",
    "qwen-common",
    "tzdata>=2026.2",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "pydantic>=2.13.4",
    "mcp>=1,<2",
    "sqlalchemy>=2.0.50",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.15.12",
    "pytest-cov>=7.1.0",
    "basedpyright>=1.39.7",
    "pre-commit>=4.6.0",
    # scripts/maintenance/check_docs.py (mkdocs.yml nav の YAML パース) が直接 import する。
    # pre-commit の推移依存で偶然入っていたが、明示依存として固定する。
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
qwen-common = { workspace = true }

# ----------------------------------------------------------------------------
# Pytest + coverage 設定
# 通常実行: cd backend && uv run pytest
# カバレッジ計測: cd backend && uv run pytest --cov
# HTML レポート: 計測後 backend/htmlcov/index.html を開く
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "data/*",
    "__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ----------------------------------------------------------------------------
# Ruff (linter)
# 実行: cd backend && uv run ruff check .
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# F: Pyflakes (未使用 import / 未定義変数 等)
# E/W: pycodestyle のエラー・警告
# I: isort (import 順序)
# B: flake8-bugbear (mutable default など意図せぬバグ)
# UP: pyupgrade (古い構文の自動更新)
# RUF100: 何も抑制していない # noqa コメントを検知（select に無いルール向けの noqa や、
#   実際には違反しない行への noqa が気づかれずに残り続けるのを防ぐ）
select = ["F", "E", "W", "I", "B", "UP", "RUF100"]
ignore = [
    "E501",  # 行長は line-length で別管理（formatter 任せにしたいので警告は抑止）
    "B008",  # FastAPI の Depends(...) を引数デフォルトに置くため
]

[tool.ruff.lint.per-file-ignores]
# テストではダミー変数や長い fixture 名が出るので一部緩める
"tests/**" = ["B011"]
# スタンドアロンスクリプトは sys.path 操作後に import するため E402 を許可
# ベンチスクリプトは可読性のため変数名ルールを緩める
"scripts/**" = ["E402", "E741", "B905"]
"_check_db.py" = ["E402"]
