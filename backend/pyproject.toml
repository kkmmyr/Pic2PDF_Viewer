[project]
name = "pic2pdf-viewer-backend"
version = "0.1.0"
description = "Pic2PDF Viewer backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "img2pdf",
    "natsort",
    "Pillow",
    "pymupdf",
    "python-dotenv",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "python-multipart>=0.0.28",
    "lancedb>=0.30.2",
    "alembic>=1.18.4",
    "qwen-common",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.15.12",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
qwen-common = { path = "../../common/llm", editable = true }

# ----------------------------------------------------------------------------
# Pytest + coverage 設定
# 通常実行: cd backend && uv run pytest
# カバレッジ計測: cd backend && uv run pytest --cov
# HTML レポート: 計測後 backend/htmlcov/index.html を開く
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# A-3: 共通 LLM パッケージ (local_llm) のパスを通す。runtime では
# services/novel_db/_llm_backend.py が sys.path に注入するが、テスト時は
# import 順が逆転しうるためこちらでも明示的に通しておく。
pythonpath = ["D:/61.tool/common/llm"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "data/*",
    "__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ----------------------------------------------------------------------------
# Ruff (linter)
# 実行: cd backend && uv run ruff check .
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# F: Pyflakes (未使用 import / 未定義変数 等)
# E/W: pycodestyle のエラー・警告
# I: isort (import 順序)
# B: flake8-bugbear (mutable default など意図せぬバグ)
# UP: pyupgrade (古い構文の自動更新)
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 行長は line-length で別管理（formatter 任せにしたいので警告は抑止）
    "B008",  # FastAPI の Depends(...) を引数デフォルトに置くため
]

[tool.ruff.lint.per-file-ignores]
# テストではダミー変数や長い fixture 名が出るので一部緩める
"tests/**" = ["B011"]
