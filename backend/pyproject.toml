[project]
name = "pic2pdf-viewer-backend"
version = "0.1.0"
description = "Pic2PDF Viewer backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "img2pdf",
    "natsort",
    "Pillow",
    "pymupdf",
    "python-dotenv",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.uv]
package = false
