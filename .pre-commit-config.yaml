repos:
  # --- Python: ruff (linter + formatter) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # --- TypeScript / React: prettier ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: node
        additional_dependencies:
          - "prettier@^3.8.3"
        files: ^frontend/src/.*\.(ts|tsx|css|json)$

  # --- docs/: リンク切れ・変更履歴肥大化・mkdocs nav 孤児を検知（BLOCKING） ---
  - repo: local
    hooks:
      - id: check-docs
        name: check-docs (docs リンク切れ・変更履歴肥大化・nav 孤児を検知)
        entry: uv run python scripts/maintenance/check_docs.py
        language: system
        files: ^(docs/.*\.md|mkdocs\.yml)$
        pass_filenames: false

      - id: file-map
        name: file-map (ファイルマップを生成し鮮度を保証)
        entry: uv run python scripts/maintenance/generate_file_map.py
        language: system
        files: ^(backend/.*|kindle-pdf/.*|frontend/src/.*|docs/design/詳細設計/詳細設計書_(バックエンド|フロントエンド)_ファイルマップ\.md)$
        pass_filenames: false

      - id: c901-ratchet
        name: c901-ratchet (既存複雑度の悪化・新規超過を防止)
        entry: uv run python scripts/maintenance/check_c901_ratchet.py
        language: system
        files: ^(backend/.*\.py|kindle-pdf/.*\.py|scripts/maintenance/(check_c901_ratchet\.py|c901_baseline\.json))$
        pass_filenames: false

      - id: code-size-ratchet
        name: code-size-ratchet (production codeの新規肥大化・既存悪化を防止)
        entry: uv run python scripts/maintenance/check_code_size.py
        language: system
        files: ^(backend/.*\.py|kindle-pdf/.*\.py|frontend/src/.*\.(ts|tsx)|scripts/maintenance/(check_code_size\.py|code_size_baseline\.json))$
        pass_filenames: false

      - id: openapi-contract
        name: openapi-contract (意図しないAPI契約差分を防止)
        entry: uv run python scripts/maintenance/check_openapi_contract.py
        language: system
        files: ^(backend/.*\.py|scripts/maintenance/(check_openapi_contract\.py|openapi_baseline\.json))$
        pass_filenames: false

      - id: import-boundaries
        name: import-boundaries (backend・frontend・Kindleの依存逆転を防止)
        entry: uv run python scripts/maintenance/check_import_boundaries.py
        language: system
        files: ^(backend/.*\.py|kindle-pdf/.*\.py|frontend/src/.*\.(ts|tsx)|scripts/maintenance/check_import_boundaries\.py)$
        pass_filenames: false

  # --- Secrets: commit 対象のハードコード済み秘密情報を検出 ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/src/index\.css|.*\.md)$
      - id: end-of-file-fixer
        exclude: ^frontend/src/index\.css$
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
