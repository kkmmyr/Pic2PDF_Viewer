repos:
  # --- Python: ruff (linter + formatter) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # --- TypeScript / React: prettier ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: node
        additional_dependencies:
          - "prettier@^3.8.3"
        files: ^frontend/src/.*\.(ts|tsx|css|json)$

  # --- docs/: リンク切れ・変更履歴肥大化・mkdocs nav 孤児を検知（BLOCKING） ---
  - repo: local
    hooks:
      - id: check-docs
        name: check-docs (docs リンク切れ・変更履歴肥大化・nav 孤児を検知)
        entry: uv run python scripts/maintenance/check_docs.py
        language: system
        files: ^(docs/.*\.md|mkdocs\.yml)$
        pass_filenames: false

      - id: file-map
        name: file-map (ファイルマップを生成し鮮度を保証)
        entry: uv run python scripts/maintenance/generate_file_map.py
        language: system
        files: ^(backend/.*|kindle-pdf/.*|frontend/src/.*|docs/design/詳細設計/詳細設計書_(バックエンド|フロントエンド)_ファイルマップ\.md)$
        pass_filenames: false

  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/src/index\.css|.*\.md)$
      - id: end-of-file-fixer
        exclude: ^frontend/src/index\.css$
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
