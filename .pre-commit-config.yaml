repos:
  # --- Python: ruff (linter + formatter) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # --- TypeScript / React: prettier ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: node
        additional_dependencies:
          - "prettier@^3.8.3"
        files: ^frontend/src/.*\.(ts|tsx|css|json)$

  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/src/index\.css|.*\.md)$
      - id: end-of-file-fixer
        exclude: ^frontend/src/index\.css$
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
