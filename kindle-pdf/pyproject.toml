[project]
name = "pic2pdf-viewer-kindle"
version = "0.1.0"
description = "Kindle capture tools for Pic2PDF Viewer"
requires-python = ">=3.12"
dependencies = [
    "pyautogui",
    "pillow>=12.3.0",
    "opencv-python",
    "numpy",
    "python-dotenv",
    "uiautomation==2.0.29; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
]
gpu = [
    "yomitoku==0.11.0",
    # Windows/Linux: CUDA 12.4. Mac: the platform-specific entries below use MPS.
    "torch==2.6.0; sys_platform != 'darwin'",
    "torchvision==0.21.0; sys_platform != 'darwin'",
    "torchaudio==2.6.0; sys_platform != 'darwin'",
    "torch==2.6.0; sys_platform == 'darwin'",
    "torchvision==0.21.0; sys_platform == 'darwin'",
    "torchaudio==2.6.0; sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
