name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Secrets: push / PR のコミット範囲を gitleaks で検査
  # ---------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Backend: ruff lint/format + pytest (with coverage)
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      # opencv-python (kindle-pdf dependency) requires libGL on Linux
      - name: System dependencies
        run: sudo apt-get install -y libgl1

      - name: Install Python dependencies
        run: uv sync

      - name: Audit Python dependencies
        working-directory: backend
        run: uv run python -m tools.dependency_audit

      - name: Lint (ruff check)
        working-directory: backend
        run: uv run ruff check .

      - name: Complexity ratchet (C901)
        run: uv run python scripts/maintenance/check_c901_ratchet.py

      - name: Format check (ruff format)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check (basedpyright)
        working-directory: backend
        run: uv run basedpyright

      - name: Test (pytest + coverage)
        working-directory: backend
        run: uv run pytest -q --cov --cov-fail-under=65

  # ---------------------------------------------------------------------------
  # Frontend: eslint + tsc + vitest
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Test (tsc + vitest)
        working-directory: frontend
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Docs: check_docs.py（リンク切れ・変更履歴肥大化・nav 孤児）+ mkdocs build --strict
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Check docs (リンク切れ・変更履歴肥大化・nav 孤児)
        run: uv run python scripts/maintenance/check_docs.py

      - name: Check file-map freshness
        run: uv run python scripts/maintenance/generate_file_map.py --check

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build docs (mkdocs build --strict)
        run: mkdocs build --strict
