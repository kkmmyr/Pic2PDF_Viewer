[project]
name = "qwen-common"
version = "0.2.0"
description = "Qwen LLM (Ollama / llama-server) common helper for cross-project reuse"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",  # async ストリーミング (astream_ask / aask) で利用
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]


[tool.setuptools.packages.find]
include = ["local_llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A-5 後: lib/ は削除済み。`from local_llm import ...` だけで完結する。
pythonpath = ["."]
